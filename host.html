<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEYBLADE X — 主持人</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap');
:root{--bg:#050507;--surface:#0d0d12;--surface2:#13131a;--border:#2a1a1a;--red:#e8001a;--red2:#ff3344;--redglow:rgba(232,0,26,0.35);--chrome:#c8ccd4;--chrome2:#8a8f9a;--gold:#ffd700;--win:#00e676;--lose:#ff1744;--text:#eeeef5;--muted:#55556a;--radius:6px;--font-head:'Orbitron',sans-serif;--font-body:'Rajdhani',sans-serif;--font-mono:'Share Tech Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;background-image:radial-gradient(ellipse 80% 40% at 50% -10%,rgba(232,0,26,0.12) 0%,transparent 70%),repeating-linear-gradient(-45deg,transparent,transparent 40px,rgba(232,0,26,0.015) 40px,rgba(232,0,26,0.015) 41px);}
header{position:relative;padding:2.2rem 2rem 1.6rem;text-align:center;overflow:hidden;border-bottom:1px solid rgba(232,0,26,0.3);background:linear-gradient(180deg,#0a0006 0%,var(--bg) 100%);}
header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 50% 0%,rgba(232,0,26,0.2) 0%,transparent 70%);pointer-events:none;}
.bey-ring{position:absolute;border-radius:50%;border:1px solid rgba(232,0,26,0.15);pointer-events:none;top:50%;left:50%;transform:translate(-50%,-50%);}
.bey-ring:nth-child(1){width:300px;height:300px;animation:spin 12s linear infinite;}
.bey-ring:nth-child(2){width:220px;height:220px;border-color:rgba(200,204,212,0.1);animation:spin 8s linear infinite reverse;}
.bey-ring:nth-child(3){width:140px;height:140px;animation:spin 5s linear infinite;}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg);}}
.bey-ring::after{content:'';position:absolute;width:6px;height:6px;background:var(--red);border-radius:50%;top:0;left:50%;transform:translateX(-50%);box-shadow:0 0 8px var(--red);}
header h1{position:relative;font-family:var(--font-head);font-size:2.2rem;font-weight:900;letter-spacing:0.12em;color:#fff;text-shadow:0 0 20px var(--redglow),0 0 60px rgba(232,0,26,0.2);}
header h1 .x-letter{color:var(--red);text-shadow:0 0 15px var(--red),0 0 40px var(--red);}
header .subtitle{position:relative;margin-top:0.5rem;font-family:var(--font-mono);font-size:0.72rem;letter-spacing:0.2em;color:var(--chrome2);text-transform:uppercase;}
.btn{padding:0.55rem 1.4rem;border:none;border-radius:var(--radius);cursor:pointer;font-family:var(--font-head);font-size:0.72rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;transition:all 0.15s;position:relative;overflow:hidden;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.1) 0%,transparent 50%);pointer-events:none;}
.btn-primary{background:linear-gradient(135deg,#c20016,var(--red));color:#fff;box-shadow:0 0 15px rgba(232,0,26,0.4);}
.btn-primary:hover{box-shadow:0 0 25px rgba(232,0,26,0.6);transform:translateY(-1px);}
.btn-secondary{background:#13131a;color:var(--chrome);border:1px solid #2a2a3a;}
.btn-secondary:hover{border-color:var(--red);color:var(--red);}
.btn-sm{padding:0.35rem 0.9rem;font-size:0.65rem;clip-path:polygon(5px 0%,100% 0%,calc(100% - 5px) 100%,0% 100%);}
input,select{background:#0a0a10;border:1px solid #2a1a1a;color:var(--text);padding:0.5rem 0.8rem;border-radius:var(--radius);font-size:0.9rem;font-family:var(--font-body);font-weight:600;outline:none;transition:border-color 0.2s,box-shadow 0.2s;}
input:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 2px rgba(232,0,26,0.15);}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);}
.tab{padding:0.9rem 2rem;cursor:pointer;color:var(--muted);font-family:var(--font-head);font-size:0.75rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;border-bottom:2px solid transparent;transition:all 0.2s;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 100%,0 100%);}
.tab.active{color:var(--red);border-bottom-color:var(--red);background:rgba(232,0,26,0.06);}
.tab:hover:not(.active){color:var(--chrome);}
.controls{display:flex;gap:1rem;padding:1rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:flex-end;position:relative;}
.controls::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--red),transparent);}
.ctrl-group{display:flex;flex-direction:column;gap:0.35rem;}
.ctrl-group label{font-size:0.65rem;color:var(--red);font-family:var(--font-mono);letter-spacing:0.15em;text-transform:uppercase;}
/* bracket */
.bracket-wrap{overflow-x:auto;padding:1.5rem;}
.bracket{display:flex;gap:2rem;min-width:max-content;align-items:flex-start;}
.round-col{display:flex;flex-direction:column;}
.round-label{text-align:center;font-family:var(--font-head);font-size:0.6rem;font-weight:700;color:var(--red);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:0.8rem;padding:0.3rem 0.5rem;background:rgba(232,0,26,0.08);border:1px solid rgba(232,0,26,0.2);clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);}
.match-slot{display:flex;flex-direction:column;justify-content:center;}
.match-card{width:210px;background:var(--surface);border:1px solid #1e1e28;border-radius:var(--radius);overflow:hidden;position:relative;}
.match-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--border);transition:background 0.2s;}
.match-card:hover::before{background:var(--red);}
.match-card.completed::before{background:var(--win);}
.match-card.bye-card{opacity:0.7;}
.match-card.bye-card::before{background:var(--muted);}
.player-row{display:flex;align-items:center;padding:0.45rem 0.7rem 0.45rem 0.85rem;gap:0.5rem;font-size:0.88rem;font-weight:600;border-bottom:1px solid #1a1a24;transition:background 0.15s;}
.player-row:last-of-type{border-bottom:none;}
.player-row.winner{background:rgba(0,230,118,0.06);color:var(--win);}
.player-row.loser{opacity:0.4;}
.player-row.bye-row{background:rgba(0,0,0,0.2);}
.player-seed{width:22px;height:22px;background:#0a0a14;border:1px solid #2a2a3a;border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:0.68rem;color:var(--red);flex-shrink:0;}
.player-name{flex:1;font-family:var(--font-body);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tbd{color:var(--muted);font-style:italic;}
.player-score{font-family:var(--font-head);font-weight:900;font-size:0.95rem;min-width:20px;text-align:right;}
.score-btn-row{display:flex;align-items:center;gap:3px;padding:3px 6px;border-top:1px solid #1a1a24;background:rgba(0,0,0,0.3);}
.score-label{font-family:var(--font-mono);font-size:0.63rem;color:var(--red);min-width:18px;flex-shrink:0;font-weight:700;}
.sc-btn{padding:2px 7px;background:#0a0a14;border:1px solid #2a1a1a;border-radius:3px;color:var(--chrome);font-size:0.72rem;font-weight:700;cursor:pointer;font-family:var(--font-mono);transition:all 0.12s;clip-path:polygon(3px 0%,100% 0%,calc(100% - 3px) 100%,0% 100%);}
.sc-btn:hover{background:rgba(232,0,26,0.15);border-color:var(--red);color:var(--red);}
.sc-btn:active{transform:scale(0.92);}
.sc-reset{color:var(--muted);font-size:0.65rem;}
.sc-reset:hover{color:var(--lose);border-color:var(--lose);}
/* swiss */
.swiss-wrap{display:flex;flex-direction:column;gap:1.2rem;}
.round-section{background:var(--surface);border:1px solid #1e1e28;border-radius:var(--radius);overflow:hidden;position:relative;}
.round-section::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--red),transparent);}
.round-header{display:flex;align-items:center;justify-content:space-between;padding:0.7rem 1rem 0.7rem 1.3rem;background:rgba(232,0,26,0.05);border-bottom:1px solid var(--border);}
.round-title{font-family:var(--font-head);font-size:0.7rem;font-weight:700;color:var(--red);letter-spacing:0.15em;text-transform:uppercase;}
.match-table{width:100%;border-collapse:collapse;font-size:0.88rem;}
.match-table th{padding:0.5rem 0.8rem;text-align:left;font-family:var(--font-mono);font-size:0.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;border-bottom:1px solid var(--border);background:rgba(0,0,0,0.2);}
.match-table td{padding:0.55rem 0.8rem;border-bottom:1px solid rgba(30,30,40,0.5);vertical-align:middle;font-weight:600;}
.match-table tr:last-child td{border-bottom:none;}
.match-table tr:hover td{background:rgba(232,0,26,0.03);}
.vs-badge{display:inline-block;padding:0.1rem 0.5rem;background:rgba(232,0,26,0.1);border:1px solid rgba(232,0,26,0.3);color:var(--red);border-radius:3px;font-family:var(--font-head);font-size:0.62rem;font-weight:900;letter-spacing:0.1em;clip-path:polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%);}
.standings-table{width:100%;border-collapse:collapse;font-size:0.9rem;background:var(--surface);border-radius:var(--radius);overflow:hidden;border:1px solid #1e1e28;}
.standings-table th{padding:0.6rem 1rem;text-align:left;font-family:var(--font-mono);font-size:0.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;background:rgba(0,0,0,0.3);border-bottom:1px solid var(--border);}
.standings-table td{padding:0.6rem 1rem;border-bottom:1px solid rgba(30,30,40,0.5);font-weight:600;}
.standings-table tr:last-child td{border-bottom:none;}
.standings-table tr:hover td{background:rgba(232,0,26,0.03);}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:3px;font-family:var(--font-head);font-size:0.72rem;font-weight:900;}
.rank-1 .rank-badge{background:rgba(255,215,0,0.15);color:var(--gold);border:1px solid rgba(255,215,0,0.4);}
.rank-2 .rank-badge{background:rgba(192,192,192,0.1);color:#c0c0c0;border:1px solid rgba(192,192,192,0.3);}
.rank-3 .rank-badge{background:rgba(205,127,50,0.1);color:#cd7f32;border:1px solid rgba(205,127,50,0.3);}
.record .w{color:var(--win);}.record .l{color:var(--lose);}
.elim-tag{font-family:var(--font-mono);font-size:0.62rem;padding:0.1rem 0.45rem;background:rgba(255,23,68,0.1);border:1px solid rgba(255,23,68,0.3);color:var(--lose);border-radius:3px;}
.active-tag{font-family:var(--font-mono);font-size:0.62rem;padding:0.1rem 0.45rem;background:rgba(0,230,118,0.08);border:1px solid rgba(0,230,118,0.25);color:var(--win);border-radius:3px;}
.section-title{font-family:var(--font-head);font-size:0.72rem;font-weight:700;color:var(--red);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:1rem;display:flex;align-items:center;gap:0.6rem;}
.section-title::before{content:'';width:3px;height:14px;background:var(--red);box-shadow:0 0 6px var(--red);border-radius:2px;display:block;}
.champion-banner{background:linear-gradient(135deg,rgba(232,0,26,0.1) 0%,rgba(255,215,0,0.08) 100%);border:1px solid rgba(255,215,0,0.3);border-radius:var(--radius);padding:1.5rem;text-align:center;position:relative;overflow:hidden;margin-bottom:1.5rem;}
.champion-banner::before{content:'X';position:absolute;font-family:var(--font-head);font-size:15rem;font-weight:900;color:rgba(232,0,26,0.04);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;line-height:1;}
.champion-banner .trophy{font-size:2.5rem;margin-bottom:0.4rem;}
.champ-name{font-family:var(--font-head);font-size:1.8rem;font-weight:900;color:var(--gold);text-shadow:0 0 20px rgba(255,215,0,0.5);letter-spacing:0.1em;}
.champ-label{font-family:var(--font-mono);font-size:0.7rem;color:var(--red);letter-spacing:0.2em;text-transform:uppercase;margin-top:0.3rem;}
.info-box{background:rgba(232,0,26,0.04);border:1px solid rgba(232,0,26,0.15);border-radius:var(--radius);padding:0.9rem 1.1rem;font-size:0.82rem;color:var(--chrome2);line-height:1.7;margin-bottom:1.2rem;}
/* seed modal */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;align-items:center;justify-content:center;}
.modal-backdrop.open{display:flex;}
.modal{background:#0d0d12;border:1px solid rgba(232,0,26,0.3);border-radius:10px;width:min(480px,95vw);max-height:85vh;display:flex;flex-direction:column;overflow:hidden;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.4rem;border-bottom:1px solid var(--border);background:rgba(232,0,26,0.05);}
.modal-head h3{font-family:var(--font-head);font-size:0.78rem;font-weight:700;color:var(--red);letter-spacing:0.15em;text-transform:uppercase;}
.modal-close{background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:0 0.3rem;}
.modal-close:hover{color:var(--red);}
.modal-toolbar{display:flex;align-items:center;gap:0.6rem;padding:0.8rem 1.4rem;border-bottom:1px solid var(--border);background:rgba(0,0,0,0.2);}
.bye-info{font-family:var(--font-mono);font-size:0.65rem;color:var(--muted);margin-left:auto;letter-spacing:0.06em;}
.seed-list{overflow-y:auto;flex:1;padding:0.5rem 0;}
.seed-row{display:grid;grid-template-columns:36px 1fr auto auto;align-items:center;gap:0.6rem;padding:0.45rem 1.4rem;border-bottom:1px solid rgba(30,30,40,0.4);transition:background 0.1s;}
.seed-row:hover{background:rgba(232,0,26,0.03);}
.seed-num{font-family:var(--font-head);font-size:0.75rem;font-weight:700;color:var(--muted);text-align:center;}
.seed-player{font-family:var(--font-body);font-weight:700;font-size:0.92rem;color:var(--text);}
.bye-chip{font-family:var(--font-mono);font-size:0.58rem;padding:0.1rem 0.4rem;background:rgba(255,170,0,0.12);border:1px solid rgba(255,170,0,0.35);color:#ffaa00;border-radius:3px;letter-spacing:0.08em;white-space:nowrap;}
.seed-btns{display:flex;gap:3px;}
.seed-mv-btn{width:24px;height:24px;background:#0a0a14;border:1px solid #2a1a1a;border-radius:3px;color:var(--chrome2);font-size:0.7rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.12s;}
.seed-mv-btn:hover:not(:disabled){border-color:var(--red);color:var(--red);}
.seed-mv-btn:disabled{opacity:0.25;cursor:not-allowed;}
.modal-foot{display:flex;gap:0.7rem;padding:1rem 1.4rem;border-top:1px solid var(--border);}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:#2a1a1a;border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--red);}
@media(max-width:600px){.controls{flex-direction:column;}.match-card{width:180px;}.player-row{font-size:0.8rem;padding:0.4rem 0.5rem;}}

#fb-status{display:flex;align-items:center;gap:8px;padding:0.4rem 1.5rem;background:#070709;border-bottom:1px solid #1a0a0a;font-family:var(--font-mono);font-size:0.72rem;}
.fb-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.fb-dot.ok{background:var(--win);box-shadow:0 0 6px var(--win)}
.fb-dot.err{background:var(--lose)}
.fb-dot.connecting{background:#ffaa00;animation:fbp 1s infinite}
@keyframes fbp{0%,100%{opacity:1}50%{opacity:0.3}}
#share-bar{display:none;align-items:center;gap:10px;padding:0.5rem 1.5rem;background:rgba(0,230,118,0.04);border-bottom:1px solid rgba(0,230,118,0.12);font-size:0.82rem;flex-wrap:wrap;}
#share-bar.visible{display:flex}
#viewer-link{flex:1;min-width:200px;background:#0a0a14;border:1px solid #1e2a1e;color:var(--win);padding:0.3rem 0.8rem;border-radius:3px;font-size:0.78rem;font-family:var(--font-mono);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.host-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(232,0,26,0.12);border:1px solid rgba(232,0,26,0.35);color:var(--red);border-radius:3px;padding:0.15rem 0.6rem;font-family:var(--font-mono);font-size:0.65rem;letter-spacing:0.1em;}
</style>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getDatabase,ref,set}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const app=initializeApp({apiKey:"AIzaSyAwQKN-ik2LuUHnDwbY2Xh5lVIsQDw0gLQ",authDomain:"beyblade-x-9fd7c.firebaseapp.com",databaseURL:"https://beyblade-x-9fd7c-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"beyblade-x-9fd7c",storageBucket:"beyblade-x-9fd7c.firebasestorage.app",messagingSenderId:"167133820929",appId:"1:167133820929:web:f07c3fccd97e20a03c6800"});const db=getDatabase(app);
window._db=db;window._ref=ref;window._set=set;window._fbReady=true;
document.getElementById('fb-dot').className='fb-dot ok';
document.getElementById('fb-msg').textContent='FIREBASE CONNECTED';
</script>
</head>
<body>
<header>
  <div class="bey-ring"></div><div class="bey-ring"></div><div class="bey-ring"></div>
  <h1>BEYBLADE <span class="x-letter">X</span></h1>
  <div class="subtitle">◆ TOURNAMENT SYSTEM ◆ <span class="host-badge">🔑 HOST</span></div>
</header>
<div id="fb-status">
  <div class="fb-dot connecting" id="fb-dot"></div>
  <span id="fb-msg" style="color:var(--muted)">CONNECTING…</span>
</div>
<div id="share-bar">
  <span style="color:var(--win);font-family:var(--font-mono);font-size:0.72rem;letter-spacing:0.1em">▶ VIEWER LINK</span>
  <input id="viewer-link" readonly onclick="this.select();document.execCommand('copy');showCopied()"/>
  <button class="btn btn-secondary btn-sm" onclick="document.getElementById('viewer-link').select();document.execCommand('copy');showCopied()">COPY</button>
  <span id="copied-hint" style="color:var(--win);font-family:var(--font-mono);font-size:0.7rem;opacity:0;transition:opacity 0.3s">✓ COPIED</span>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('single')">▶ SINGLE ELIM</div>
  <div class="tab" onclick="switchTab('swiss')">◈ SWISS ROUND</div>
</div>


<div class="controls">
  <div class="ctrl-group">
    <label>PLAYERS（最多128）</label>
    <select id="playerCount" onchange="updateCount()">
      <option value="4">4</option><option value="6">6</option>
      <option value="8" selected>8</option><option value="12">12</option>
      <option value="16">16</option><option value="24">24</option>
      <option value="32">32</option><option value="48">48</option>
      <option value="64">64</option><option value="128">128</option>
    </select>
  </div>
  <div class="ctrl-group">
    <label>CUSTOM COUNT</label>
    <input type="number" id="customCount" min="2" max="128" placeholder="2–128" style="width:110px"/>
  </div>
  <div class="ctrl-group">
    <label>WIN SCORE</label>
    <input type="number" id="winScore" min="1" max="99" value="4" style="width:75px"/>
  </div>
  <div class="ctrl-group" style="flex-direction:row;gap:0.5rem;align-self:flex-end">
    <button class="btn btn-secondary" onclick="openSeedModal()">⚙ SEEDS</button>
    <button class="btn btn-secondary" onclick="shufflePlayers()">⚡ SHUFFLE</button>
    <button class="btn btn-primary" onclick="generate()">▶ GENERATE</button>
    <button class="btn btn-secondary btn-sm" id="undo-btn" onclick="undo()" disabled style="opacity:0.35;border-color:rgba(255,170,0,0.3);color:#ffaa00" title="無可回溯">↩ UNDO</button>
    <button class="btn btn-secondary btn-sm" onclick="resetAll()">↺ RESET</button>
  </div>
</div>

<div id="app"></div>

<div class="modal-backdrop" id="seedModal">
  <div class="modal">
    <div class="modal-head">
      <h3>⚙ SEED MANAGEMENT</h3>
      <button class="modal-close" onclick="closeSeedModal()">✕</button>
    </div>
    <div class="modal-toolbar">
      <button class="btn btn-secondary btn-sm" onclick="randomizeSeeds()">🔀 RANDOMIZE</button>
      <span class="bye-info" id="bye-info"></span>
    </div>
    <div class="seed-list" id="seed-list"></div>
    <div class="modal-foot">
      <button class="btn btn-secondary" style="flex:1" onclick="closeSeedModal()">CANCEL</button>
      <button class="btn btn-primary" style="flex:1" onclick="saveSeedsAndGenerate()">▶ GENERATE</button>
    </div>
  </div>
</div>

<script>

let currentTab='single', numPlayers=8, players=[], singleState=null, swissState=null;

function nextPow2(n){let p=1;while(p<n)p*=2;return p;}

function seededPositions(size){
  if(size===1)return[1];
  const half=seededPositions(size/2),res=[];
  for(const s of half){res.push(s);res.push(size+1-s);}
  return res;
}

function getCount(){
  const c=parseInt(document.getElementById('customCount').value);
  if(!isNaN(c)&&c>=2&&c<=128)return c;
  return parseInt(document.getElementById('playerCount').value);
}
function getWinScore(){return parseInt(document.getElementById('winScore').value)||4;}
function updateCount(){numPlayers=getCount();}
function initPlayers(n){players=Array.from({length:n},(_,i)=>String(i+1));}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&tab==='single')||(i===1&&tab==='swiss')));
  renderCurrent();
}
function renderCurrent(){
  if(currentTab==='single'&&singleState)renderSingle();
  else if(currentTab==='swiss'&&swissState)renderSwiss();
  else showEmpty();
}
function showEmpty(){
  document.getElementById('app').innerHTML=`<div style="text-align:center;padding:4rem 2rem;color:var(--muted)"><div style="font-family:var(--font-head);font-size:4rem;color:rgba(232,0,26,0.12);letter-spacing:0.1em">X</div><div style="font-family:var(--font-mono);font-size:0.8rem;letter-spacing:0.15em;margin-top:0.5rem">SELECT PLAYERS · SET SEEDS · GENERATE</div></div>`;
}

/* ── SEED MODAL ── */
function openSeedModal(){
  const n=getCount();
  if(n<2||n>128){alert('人數需在 2–128 之間');return;}
  if(players.length!==n)initPlayers(n);
  renderSeedList();
  document.getElementById('seedModal').classList.add('open');
}
function closeSeedModal(){document.getElementById('seedModal').classList.remove('open');}
function calcByes(){const n=players.length;return nextPow2(n)-n;}
function renderSeedList(){
  const numByes=calcByes();
  const n=players.length;
  document.getElementById('bye-info').textContent=numByes>0?`TOP ${numByes} SEED${numByes>1?'S':''} GET BYE`:'NO BYES';
  document.getElementById('seed-list').innerHTML=players.map((p,i)=>`
    <div class="seed-row">
      <div class="seed-num">${i+1}</div>
      <div class="seed-player"># ${p}</div>
      <div>${i<numByes?'<span class="bye-chip">BYE</span>':'<span style="width:36px;display:inline-block"></span>'}</div>
      <div class="seed-btns">
        <button class="seed-mv-btn" ${i===0?'disabled':''} onclick="moveSeed(${i},-1)">▲</button>
        <button class="seed-mv-btn" ${i===n-1?'disabled':''} onclick="moveSeed(${i},1)">▼</button>
      </div>
    </div>`).join('');
}
function moveSeed(i,dir){[players[i],players[i+dir]]=[players[i+dir],players[i]];renderSeedList();}
function randomizeSeeds(){shuffle(players);renderSeedList();}
function saveSeedsAndGenerate(){closeSeedModal();_generate();}

/* ── GENERATE ── */
function shufflePlayers(){
  const n=getCount();
  if(n<2||n>128){alert('人數需在 2–128 之間');return;}
  initPlayers(n);shuffle(players);_generate();
}
function generate(){
  const n=getCount();
  if(n<2||n>128){alert('人數需在 2–128 之間');return;}
  if(players.length!==n)initPlayers(n);
  _generate();
}
function _generate(){
  numPlayers=players.length;_clearHistory();
  if(currentTab==='single'){singleState=buildSingle([...players]);renderSingle();}
  else{swissState=buildSwiss([...players]);renderSwiss();}
}
function resetAll(){singleState=null;swissState=null;players=[];_clearHistory();showEmpty();}

/* ── SINGLE ELIMINATION ── */
function buildSingle(sp){
  const n=sp.length,bs=nextPow2(n),pos=seededPositions(bs);
  const r0=[];
  for(let i=0;i<bs;i+=2){
    const sA=pos[i],sB=pos[i+1];
    const pA=sA<=n?sp[sA-1]:null,pB=sB<=n?sp[sB-1]:null;
    const bye=pA===null||pB===null;
    const m={a:pA,b:pB,scoreA:0,scoreB:0,winner:null,loser:null,bye};
    if(bye)m.winner=pA!==null?pA:pB;
    r0.push(m);
  }
  const nR=Math.log2(bs),rounds=[r0];
  for(let r=1;r<nR;r++){
    const prev=rounds[r-1],next=[];
    for(let i=0;i<prev.length;i+=2)
      next.push({a:null,b:null,scoreA:0,scoreB:0,winner:null,loser:null,bye:false,srcA:[r-1,i],srcB:[r-1,i+1]});
    rounds.push(next);
  }
  return{rounds,bracketSize:bs,n,champion:null};
}

function propagateSingle(){
  const s=singleState;
  for(let r=1;r<s.rounds.length;r++){
    for(let m=0;m<s.rounds[r].length;m++){
      const match=s.rounds[r][m];
      const[ra,ma]=match.srcA,[rb,mb]=match.srcB;
      const nA=s.rounds[ra][ma].winner,nB=s.rounds[rb][mb].winner;
      if(match.a!==nA||match.b!==nB){
        match.a=nA;match.b=nB;
        if(match.winner&&match.winner!==nA&&match.winner!==nB){
          match.winner=null;match.loser=null;match.scoreA=0;match.scoreB=0;
        }
      }
    }
  }
  s.champion=s.rounds[s.rounds.length-1][0].winner;
}

function renderSingle(){
  propagateSingle();
  const s=singleState,nR=s.rounds.length,slotH=118;
  let html='';
  if(s.champion)html+=`<div class="champion-banner" style="margin:1.5rem"><div class="trophy">🏆</div><div class="champ-name">${s.champion}</div><div class="champ-label">CHAMPION</div></div>`;
  html+='<div class="bracket-wrap"><div class="bracket">';
  s.rounds.forEach((round,ri)=>{
    const rev=nR-1-ri;
    const rName=rev===0?'🏆 FINAL':rev===1?'SEMI-FINAL':rev===2?'QUARTER-FINAL':`ROUND ${ri+1}`;
    const totalSlots=s.bracketSize/Math.pow(2,ri);
    const spacing=(slotH*totalSlots)/round.length;
    html+=`<div class="round-col"><div class="round-label">${rName}</div>`;
    round.forEach((match,mi)=>{
      const aWin=match.winner&&match.winner===match.a;
      const bWin=match.winner&&match.winner===match.b;
      const isBye=match.bye||match.b===null;
      const canScore=match.a&&match.b&&!match.winner&&!isBye;
      const sa=match.scoreA||0,sb=match.scoreB||0;
      html+=`<div class="match-slot" style="height:${spacing}px">
        <div class="match-card ${match.winner?'completed':''} ${isBye?'bye-card':''}">
          <div class="player-row ${aWin?'winner':match.winner&&match.a&&!aWin?'loser':''}">
            <div class="player-seed">${match.a||'?'}</div>
            <div class="player-name ${!match.a?'tbd':''}">${match.a||'TBD'}</div>
            <div class="player-score" style="color:${aWin?'var(--win)':sa>0?'var(--chrome)':'var(--muted)'}">${isBye?'':sa}</div>
          </div>
          <div class="player-row ${isBye?'bye-row':bWin?'winner':match.winner&&match.b&&!bWin?'loser':''}">
            <div class="player-seed" style="${isBye||!match.b?'opacity:0.3;color:var(--muted)':''}">${match.b||'BYE'}</div>
            <div class="player-name" style="${isBye||!match.b?'color:var(--muted);font-style:italic':''}">${match.b||'BYE'}</div>
            <div class="player-score" style="color:${bWin?'var(--win)':sb>0?'var(--chrome)':'var(--muted)'}">${isBye||!match.b?'':sb}</div>
          </div>
          ${canScore?`<div class="score-btn-row"><span class="score-label">${match.a}</span>
            <button class="sc-btn" onclick="addScore('single',${ri},${mi},'a',1)">+1</button>
            <button class="sc-btn" onclick="addScore('single',${ri},${mi},'a',2)">+2</button>
            <button class="sc-btn" onclick="addScore('single',${ri},${mi},'a',3)">+3</button>
          </div><div class="score-btn-row"><span class="score-label">${match.b}</span>
            <button class="sc-btn" onclick="addScore('single',${ri},${mi},'b',1)">+1</button>
            <button class="sc-btn" onclick="addScore('single',${ri},${mi},'b',2)">+2</button>
            <button class="sc-btn" onclick="addScore('single',${ri},${mi},'b',3)">+3</button>
          </div><div class="score-btn-row" style="justify-content:flex-end;padding:2px 6px 4px">
            <button class="sc-btn sc-reset" onclick="resetScore('single',${ri},${mi})">↺ 清零</button>
          </div>`:''}
        </div></div>`;
    });
    html+='</div>';
  });
  html+='</div></div>';
  document.getElementById('app').innerHTML=html;
}

/* ── UNDO SYSTEM ── */
let _history=[];
const MAX_HIST=30;
function saveHistory(){
  _history.push({
    single:singleState?JSON.parse(JSON.stringify(singleState)):null,
    swiss:swissState?JSON.parse(JSON.stringify(swissState)):null
  });
  if(_history.length>MAX_HIST)_history.shift();
  _updateUndoBtn();
}
function undo(){
  if(_history.length===0)return;
  const prev=_history.pop();
  singleState=prev.single;swissState=prev.swiss;
  _updateUndoBtn();
  renderCurrent();
}
function _updateUndoBtn(){
  const btn=document.getElementById('undo-btn');
  if(!btn)return;
  btn.disabled=_history.length===0;
  btn.style.opacity=_history.length===0?'0.35':'1';
  btn.title=_history.length>0?`上一動（還可回溯 ${_history.length} 步）`:'無可回溯';
}
function _clearHistory(){_history=[];_updateUndoBtn();}

/* ── SCORING ── */
function addScore(type,ri,mi,side,pts){
  const match=type==='single'?singleState.rounds[ri][mi]:swissState.rounds[ri][mi];
  if(match.winner)return;
  saveHistory();
  if(side==='a')match.scoreA=(match.scoreA||0)+pts;
  else match.scoreB=(match.scoreB||0)+pts;
  const ws=getWinScore();
  if(match.scoreA>=ws){
    match.winner=match.a;match.loser=match.b;
    if(type==='swiss'){swissState.standings[match.a].wins++;swissState.standings[match.b].losses++;if(swissState.standings[match.b].losses>=2)swissState.standings[match.b].eliminated=true;}
  } else if(match.scoreB>=ws){
    match.winner=match.b;match.loser=match.a;
    if(type==='swiss'){swissState.standings[match.b].wins++;swissState.standings[match.a].losses++;if(swissState.standings[match.a].losses>=2)swissState.standings[match.a].eliminated=true;}
  }
  if(type==='single')renderSingle();else{advanceSwissRound();renderSwiss();}
}
function resetScore(type,ri,mi){
  saveHistory();
  const match=type==='single'?singleState.rounds[ri][mi]:swissState.rounds[ri][mi];
  match.scoreA=0;match.scoreB=0;
  if(type==='single')renderSingle();else renderSwiss();
}

/* ── SWISS ── */
function buildSwiss(ps){
  const standings={};
  ps.forEach(p=>{standings[p]={wins:0,losses:0,eliminated:false,byes:0};});
  const r0=pairSwiss(ps,standings);
  return{players:[...ps],standings,rounds:[r0],currentRound:0,champion:null};
}
function pairSwiss(active,standings){
  const sorted=[...active].sort((a,b)=>{
    const sa=standings[a],sb=standings[b];
    if(sb.wins!==sa.wins)return sb.wins-sa.wins;
    return sa.losses-sb.losses;
  });
  const round=[],pool=[...sorted];
  if(pool.length%2!==0){
    let byeIdx=pool.length-1;
    for(let i=pool.length-1;i>=0;i--){if(standings[pool[i]].byes===0){byeIdx=i;break;}}
    const bp=pool.splice(byeIdx,1)[0];
    standings[bp].byes++;standings[bp].wins++;
    round.push({a:bp,b:null,scoreA:0,scoreB:0,winner:bp,loser:null,bye:true});
  }
  for(let i=0;i<pool.length;i+=2)
    round.push({a:pool[i],b:pool[i+1],scoreA:0,scoreB:0,winner:null,loser:null,bye:false});
  return round;
}
function advanceSwissRound(){
  const s=swissState;
  if(!s.rounds[s.currentRound].every(m=>m.winner))return;
  const active=s.players.filter(p=>!s.standings[p].eliminated);
  if(active.length<=1){s.champion=active[0]||'—';return;}
  s.rounds.push(pairSwiss(active,s.standings));
  s.currentRound++;
}
function renderSwiss(){
  const s=swissState;
  let html='';
  if(s.champion)html+=`<div class="champion-banner" style="margin:1.5rem 1.5rem 0"><div class="trophy">🏆</div><div class="champ-name">${s.champion}</div><div class="champ-label">CHAMPION</div></div>`;
  const sorted=[...s.players].sort((a,b)=>{const sa=s.standings[a],sb=s.standings[b];if(sb.wins!==sa.wins)return sb.wins-sa.wins;return sa.losses-sb.losses;});
  html+=`<div style="padding:1.5rem"><div class="section-title">STANDINGS</div>
  <table class="standings-table" style="margin-bottom:1.5rem"><thead><tr><th>RANK</th><th>BLADER</th><th>W / L</th><th>STATUS</th></tr></thead><tbody>`;
  sorted.forEach((p,i)=>{
    const st=s.standings[p];
    const cls=i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'';
    html+=`<tr class="${cls}"><td><div class="rank-badge">#${i+1}</div></td><td style="font-weight:700">${p}</td><td class="record"><span class="w">${st.wins}W</span> <span style="color:var(--muted)">/</span> <span class="l">${st.losses}L</span>${st.byes>0?`<span style="color:var(--muted);font-size:0.72rem;margin-left:5px">(BYE×${st.byes})</span>`:''}</td><td>${st.eliminated?'<span class="elim-tag">ELIMINATED</span>':'<span class="active-tag">ACTIVE</span>'}</td></tr>`;
  });
  html+=`</tbody></table><div class="swiss-wrap">`;
  s.rounds.forEach((round,ri)=>{
    const allDone=round.every(m=>m.winner);
    html+=`<div class="round-section"><div class="round-header"><div class="round-title">ROUND ${ri+1}</div><span style="font-family:var(--font-mono);font-size:0.68rem;color:${allDone?'var(--win)':'var(--muted)'}">${allDone?'✓ COMPLETE':`${round.filter(m=>m.winner).length}/${round.length} DONE`}</span></div>
    <table class="match-table"><thead><tr><th>#</th><th>PLAYER A</th><th></th><th>PLAYER B</th><th>SCORE / ACTION</th></tr></thead><tbody>`;
    round.forEach((match,mi)=>{
      const aWin=match.winner===match.a,bWin=match.winner===match.b;
      const sa=match.scoreA||0,sb=match.scoreB||0,isBye=match.bye||!match.b;
      html+=`<tr><td style="color:var(--muted);font-family:var(--font-mono);font-size:0.72rem">${mi+1}</td>
        <td style="font-weight:700;color:${aWin?'var(--win)':'var(--text)'}">${match.a}${!match.winner&&!isBye?`<span style="color:${sa>0?'var(--red)':'var(--muted)'};font-family:var(--font-mono);font-size:0.75rem;margin-left:5px">${sa}pt</span>`:''}</td>
        <td style="text-align:center">${isBye?'<span style="color:var(--muted);font-family:var(--font-mono);font-size:0.65rem">AUTO</span>':match.winner?`<span style="font-family:var(--font-mono);font-size:0.7rem;color:var(--muted)">${sa}:${sb}</span>`:`<div style="display:flex;flex-direction:column;align-items:center;gap:2px"><span class="vs-badge">VS</span><button class="sc-btn sc-reset" onclick="resetScore('swiss',${ri},${mi})" style="font-size:0.62rem;margin-top:2px">↺</button></div>`}</td>
        <td style="font-weight:700;color:${bWin?'var(--win)':isBye?'var(--muted)':'var(--text)'}">${isBye?'<span style="color:var(--muted);font-style:italic">BYE</span>':match.b||'—'}${!match.winner&&!isBye&&match.b?`<span style="color:${sb>0?'var(--red)':'var(--muted)'};font-family:var(--font-mono);font-size:0.75rem;margin-left:5px">${sb}pt</span>`:''}</td>
        <td>${match.winner?`<span style="font-family:var(--font-mono);font-size:0.75rem;color:var(--win)">▶ ${match.winner}${isBye?' (BYE)':''}</span>`:isBye?'':`<div style="display:flex;flex-direction:column;gap:3px"><div style="display:flex;gap:3px;align-items:center"><span style="font-family:var(--font-mono);font-size:0.62rem;color:var(--muted);min-width:16px">${match.a}:</span><button class="sc-btn" onclick="addScore('swiss',${ri},${mi},'a',1)">+1</button><button class="sc-btn" onclick="addScore('swiss',${ri},${mi},'a',2)">+2</button><button class="sc-btn" onclick="addScore('swiss',${ri},${mi},'a',3)">+3</button></div><div style="display:flex;gap:3px;align-items:center;margin-top:2px"><span style="font-family:var(--font-mono);font-size:0.62rem;color:var(--muted);min-width:16px">${match.b}:</span><button class="sc-btn" onclick="addScore('swiss',${ri},${mi},'b',1)">+1</button><button class="sc-btn" onclick="addScore('swiss',${ri},${mi},'b',2)">+2</button><button class="sc-btn" onclick="addScore('swiss',${ri},${mi},'b',3)">+3</button></div></div>`}</td></tr>`;
    });
    html+=`</tbody></table></div>`;
  });
  html+='</div></div>';
  document.getElementById('app').innerHTML=html;
}

function pushToFirebase(){
  if(!window._fbReady)return;
  const s={tab:currentTab,winScore:getWinScore(),singleState:singleState?JSON.parse(JSON.stringify(singleState)):null,swissState:swissState?JSON.parse(JSON.stringify(swissState)):null,ts:Date.now()};
  window._set(window._ref(window._db,'tournament'),s);
}
const _rs=renderSingle;renderSingle=function(){_rs();pushToFirebase();};
const _rw=renderSwiss;renderSwiss=function(){_rw();pushToFirebase();};
const __gen=_generate;_generate=function(){
  __gen();
  const bar=document.getElementById('share-bar');
  if(bar){bar.classList.add('visible');document.getElementById('viewer-link').value=window.location.href.replace('host.html','viewer.html');}
};
function showCopied(){const h=document.getElementById('copied-hint');h.style.opacity='1';setTimeout(()=>h.style.opacity='0',1500);}
showEmpty();
</script>
</body></html>
